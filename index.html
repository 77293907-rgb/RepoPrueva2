<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Página Sencilla</title>
    <!-- Enlace al archivo CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Mi Primera Web</h1>
        <button id="btn-tema">🌙 Modo Oscuro</button>
    </header>

    <main>
        <section class="tarjeta">
            <h2>Saludo Personalizado</h2>
            <p>Escribe tu nombre para recibir un saludo:</p>
            <div class="input-grupo">
                <input type="text" id="input-nombre" placeholder="Tu nombre...">
                <button id="btn-saludar">Saludar</button>
            </div>
            <p id="mensaje-saludo" class="destacado"></p>
        </section>

        <section class="tarjeta">
            <h2>Contador de Clics</h2>
            <p id="contador" class="numero">0</p>
            <div class="botones-grupo">
                <button id="btn-restar">-1</button>
                <button id="btn-reiniciar">Reiniciar</button>
                <button id="btn-sumar">+1</button>
            </div>
        </section>
    </main>

    <footer>
        <p>Hecho con HTML, CSS y JavaScript puro.</p>
        <p>tercer commit </p>
    </footer>

    <!-- Enlace al archivo JavaScript -->
    <script src="script.js"></script>
</body>
</html>
